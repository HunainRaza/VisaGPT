{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <h2 class="text-center mb-4"><i class="bi bi-graph-up"></i> Visa Approval Prediction</h2>
            <div class="card shadow">
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'predictions:predict' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Visa Type</label>
                            <select name="visa_type" class="form-select" required>
                                <option value="H-1B">H-1B (Work Visa)</option>
                                <option value="F-1">F-1 (Student Visa)</option>
                                <option value="L-1">L-1 (Intra-company Transfer)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Country</label>
                            <select name="country" class="form-select" required>
                                <option value="USA">United States</option>
                                <option value="Canada">Canada</option>
                                <option value="UK">United Kingdom</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Job Title</label>
                            <input type="text" name="job_title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Salary (USD)</label>
                            <input type="number" name="salary" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Age</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Education Level</label>
                            <select name="education" class="form-select" required>
                                <option value="Bachelors">Bachelor's Degree</option>
                                <option value="Masters">Master's Degree</option>
                                <option value="PhD">PhD</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Work Experience (years)</label>
                            <input type="number" name="experience" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">
                            <i class="bi bi-cpu"></i> Predict Approval Chances
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
